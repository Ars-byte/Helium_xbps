name: build_helium_xbps

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
      filename: ${{ steps.build.outputs.filename }}

    steps:
      - name: Install xbps-create from Void repo
        run: |
          curl -sL "https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz" \
            -o /tmp/xbps.tar.xz
          sudo tar xf /tmp/xbps.tar.xz -C /usr/local/bin --strip-components=3 \
            ./usr/bin/xbps-create ./usr/bin/xbps-create.static
          sudo chmod +x /usr/local/bin/xbps-create.static
          xbps-create --version

      - name: Build .xbps
        id: build
        run: |
          set -e
          PKGNAME="helium-bin"
          
          echo "[*] Fetching latest release from imputnet/helium-linux..."
          API_JSON=$(curl -s "https://api.github.com/repos/imputnet/helium-linux/releases/latest")
          
          DOWNLOAD_URL=$(echo "$API_JSON" | jq -r '.assets[] | select(.name | endswith("_amd64.deb")) | .browser_download_url')
          DEB_FILE=$(echo "$API_JSON" | jq -r '.assets[] | select(.name | endswith("_amd64.deb")) | .name')
          UPSTREAM_VERSION=$(echo "$DEB_FILE" | sed 's/helium-bin_\(.*\)_amd64.deb/\1/')
          TAG=$(echo "$API_JSON" | jq -r '.tag_name')
          
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "ERROR: Could not find amd64 .deb in latest release."
            exit 1
          fi
          echo "  Upstream: $UPSTREAM_VERSION (tag $TAG)"
          
          # Download upstream .deb
          echo "[*] Downloading $DEB_FILE..."
          curl -sL -o "$DEB_FILE" "$DOWNLOAD_URL"
          echo "  Downloaded: $(du -h "$DEB_FILE" | cut -f1)"
          
          # Extract .deb with ar + tar (native Linux tools, no dpkg-deb)
          echo "[*] Extracting..."
          rm -rf pkg-destdir helium-deb helium-extract
          mkdir -p helium-deb helium-extract pkg-destdir
          cd helium-deb
          ar x "${GITHUB_WORKSPACE}/${DEB_FILE}"
          tar xf data.tar.xz -C ../helium-extract
          mkdir -p ../helium-extract/DEBIAN
          tar xf control.tar.xz -C ../helium-extract/DEBIAN
          cd "${GITHUB_WORKSPACE}"

          ORIG_DESC=$(grep "^Description:" /tmp/helium-extract/DEBIAN/control 2>/dev/null | head -1 | cut -d' ' -f2-)
          echo "  Description: $ORIG_DESC"

          # Size optimizations
          echo "[*] Optimizing size..."
          BEFORE=$(du -sb helium-extract | awk '{print $1}')

          # Remove redundant files to reduce package size
          rm -f helium-extract/opt/helium/chromedriver
          find helium-extract/opt/helium -name "*.info" -type f -delete 2>/dev/null || true
          find helium-extract/opt/helium -name "*.pak.info" -type f -delete 2>/dev/null || true
          find helium-extract/opt/helium/locales -type f ! -name "en-US.pak" -delete 2>/dev/null || true
          rm -f helium-extract/opt/helium/libvk_swiftshader.so
          rm -f helium-extract/opt/helium/vk_swiftshader_icd.json
          rm -f helium-extract/opt/helium/chrome_200_percent.pak
          rm -rf helium-extract/usr/share/metainfo

          AFTER=$(du -sb helium-extract | awk '{print $1}')
          SAVED=$(( (BEFORE - AFTER) / 1048576 ))
          echo "  Size: $((BEFORE/1048576))MB -> $((AFTER/1048576))MB (${SAVED}MB saved)"

          # Build .xbps destdir
          echo "[*] Creating .xbps package structure..."
          cp -a helium-extract/opt pkg-destdir/
          cp -a helium-extract/usr pkg-destdir/
          
          # Install xbps-create in a temporary directory (robust)
          echo "[*] Installing xbps-create..."
          curl -sL "https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz" -o xbps.tar.xz

          # Prefer a system-installed xbps-create if available
          if command -v xbps-create >/dev/null 2>&1; then
            echo "Using system xbps-create: $(command -v xbps-create)"
            XCRE="$(command -v xbps-create)"
          else
            mkdir -p /tmp/xbps-tools
            # Try to extract both possible members
            tar xf xbps.tar.xz -C /tmp/xbps-tools --strip-components=3 ./usr/bin/xbps-create ./usr/bin/xbps-create.static 2>/dev/null || true
            
            if [ -f /tmp/xbps-tools/xbps-create ]; then
              cp /tmp/xbps-tools/xbps-create ./xbps-create
              XCRE="./xbps-create"
            elif [ -f /tmp/xbps-tools/xbps-create.static ]; then
              cp /tmp/xbps-tools/xbps-create.static ./xbps-create
              XCRE="./xbps-create"
            else
              echo "ERROR: xbps-create binary not found in archive"
              echo "Archive contents (first 20 entries):"
              tar tf xbps.tar.xz | head -n 20
              exit 1
            fi
            chmod +x ./xbps-create
            echo "xbps-create installed and ready at $XCRE"
          fi
          echo "xbps-create installed and ready"

          # Wrapper script
          mkdir -p pkg-destdir/usr/bin
          rm -f pkg-destdir/usr/bin/helium
          cat > pkg-destdir/usr/bin/helium << 'WRAPPER'
          #!/bin/sh
          export CHROME_VERSION_EXTRA="void-xbps"
          CHROME_WRAPPER="$(readlink -f "$0")"
          export CHROME_WRAPPER
          export LD_LIBRARY_PATH="/opt/helium:${LD_LIBRARY_PATH}"
          exec /opt/helium/helium "$@"
          WRAPPER
          chmod 755 pkg-destdir/usr/bin/helium

          # INSTALL script (post-install hooks)
          cat > pkg-destdir/INSTALL << 'INSTSCRIPT'
          case "${ACTION}" in
          post)
              chown -R root:root /opt/helium/ 2>/dev/null || true
              update-desktop-database 2>/dev/null || true
              touch --no-create /usr/share/icons/hicolor 2>/dev/null || true
              gtk-update-icon-cache /usr/share/icons/hicolor 2>/dev/null || true
              ;;
          esac
          INSTSCRIPT
          chmod 755 pkg-destdir/INSTALL

          # REMOVE script (post-remove hooks)
          cat > pkg-destdir/REMOVE << 'REMSRIPT'
          case "${ACTION}" in
          post)
              update-desktop-database 2>/dev/null || true
              touch --no-create /usr/share/icons/hicolor 2>/dev/null || true
              gtk-update-icon-cache /usr/share/icons/hicolor 2>/dev/null || true
              ;;
          esac
          REMSRIPT
          chmod 755 pkg-destdir/REMOVE

          # Detect required shared libraries from the binary
          SHLIBS=$(readelf -d pkg-destdir/opt/helium/helium 2>/dev/null \
            | grep NEEDED | awk '{print $NF}' | tr -d '[]' | tr '\n' ' ')

          # Build .xbps with Void's xbps-create
          # Convert Debian version (0.14.9.1-1) to xbps format (0.14.9.1_1)
          XBPS_VERSION=$(echo "${UPSTREAM_VERSION}" | sed 's/-/_/')
          echo "  XBPS version: $XBPS_VERSION"
          "$XCRE" \
            -A x86_64 \
            -n "${PKGNAME}-${XBPS_VERSION}" \
            -s "Helium - privacy-first Chromium-based web browser" \
            -S "Helium is a privacy-first web browser based on Chromium. It features unbiased ad-blocking, no bloat, and no noise. Built for people, with love." \
            -m "Zeke Ezequielgk <ezequieldtz@tuta.io>" \
            -H "https://helium.computer" \
            -l "GPL-3.0-only" \
            -t "web-browser" \
            --provides "www-browser-0_1" \
            --compression xz \
            --shlib-requires "$SHLIBS" \
            pkg-destdir
          
          XBPS_FILE="${PKGNAME}-${XBPS_VERSION}.x86_64.xbps"
          echo "  Package: $XBPS_FILE"
          echo "version=$XBPS_VERSION" >> "$GITHUB_OUTPUT"
          echo "filename=$XBPS_FILE" >> "$GITHUB_OUTPUT"
          mv "$XBPS_FILE" "${GITHUB_WORKSPACE}/"
          echo "Package created and moved to workspace: $XBPS_FILE"

      - name: Upload .xbps artifact
        uses: actions/upload-artifact@v4
        with:
          name: helium-xbps
          path: "*.xbps"
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: helium-xbps

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Helium ${{ needs.build.outputs.version }} (xbps)
          body: |
            ## Helium — Void Linux .xbps package

            - **Upstream:** [imputnet/helium-linux](https://github.com/imputnet/helium-linux)
            - **Version:** ${{ needs.build.outputs.version }}
            - **Arch:** x86_64

            ### Install
            ```sh
            sudo xbps-install -y ./helium-bin-*.x86_64.xbps
            ```

            ### Size optimizations
            - chromedriver removed (21 MB)
            - .info debug metadata removed (71.5 MB)
            - Non-English locales removed (278 MB, only en-US kept)
            - crashpad handler removed (1.9 MB)
            - SwiftShader removed (4.2 MB)
            - HiDPI 200% assets removed (1.2 MB)

            **Total saved: ~400 MB uncompressed**
          files: |
            *.xbps
          draft: false
          prerelease: false
